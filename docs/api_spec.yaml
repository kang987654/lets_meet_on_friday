openapi: 3.1.1

info:
  title: Local Friday — Internal Interface Contract Specification
  version: 1.2.0
  description: |
    ## 문서 목적

    이 문서는 Local Friday Android 앱의 **내부 인터페이스 계약 명세**입니다.

    Local Friday는 외부 REST API가 없는 오프라인 우선 로컬 앱입니다.
    따라서 이 spec은 전통적인 HTTP 엔드포인트 대신
    **레이어 간 인터페이스 계약, 데이터 스키마, 모델 출력 포맷**을 정의합니다.

    ## 이 문서가 정의하는 것

    1. **UseCase 입출력 계약** — 각 UseCase의 입력/출력 타입
    2. **Tool 인터페이스 계약** — Platform Tool의 메서드 시그니처
    3. **ModelRunner 계약** — 모델 추론 인터페이스
    4. **모델 구조화 출력 스키마** — AI 모델이 반환하는 JSON 포맷
    5. **도메인 모델 스키마** — 핵심 데이터 구조
    6. **DB 스키마 계약** — Room 테이블 구조
    7. **Export/Import 포맷** — 백업 파일 스키마 (v1)
    8. **에러 코드 매핑 계약** — AppError ↔ ErrorCode 매핑 규칙

    ## 문서 우선순위

    - 제품 정책/범위: `PRD.md`
    - 구조/책임: `architecture.md`
    - 내부 계약 source of truth: **이 문서**
    - 구현 순서/작업 단위: `tasks.md`

    ## AI Agent 사용 지침

    - 이 문서의 schema를 기준으로 Kotlin data class를 생성한다
    - `$ref`로 참조된 스키마는 재사용 가능한 공통 타입이다
    - `x-kotlin-type` 확장 필드는 대응하는 Kotlin 타입을 명시한다
    - `x-layer` 확장 필드는 해당 계약이 속한 레이어를 명시한다
    - `x-file-path` 확장 필드는 구현 파일 경로를 명시한다
    - `# v0`, `# v1`, `# v2` 주석은 PRD.md Version Scope 기준 구현 버전을 의미한다

    ## 타입/계약 설계 원칙

    - 이 문서의 `Result`형 응답은 HTTP 응답이 아니라 내부 함수 호출 결과의 표현이다
    - Kotlin 표준 `Result<T>`와 혼동을 피하기 위해 구현에서는 `AppResult<T>`를 사용한다
    - 시간 표현은 아래 원칙을 따른다:
      - **DB/저장소 내부 저장**: Unix timestamp(ms)
      - **도메인 내부 표현**: Long(ms) 또는 명시적 ISO 문자열
      - **경계 계약 표현**: ISO 8601 string 우선
      - 변환은 mapper 계층에서만 수행한다
    - `ActionCard.payload`는 임의 타입(`Any`)이 아니라 actionType에 따라 결정되는 **typed payload**이다
    - STT 결과 전달은 callback보다 `state + transcript` 상태 관찰 계약을 기본으로 한다
    - 캘린더 중복 일정 감지는 **경고 성격**이 우선이며, v0 기본 UX는 사용자 확인 우선이다

    ## AppError ↔ ErrorCode 매핑 원칙

    구현에서는 `core/common/AppError.kt`의 sealed class를 사용하고,
    본 spec의 `ErrorCode`는 직렬화/표현용 계약 값이다.

    대표 매핑 예:
    - `AppError.ValidationError(field=content, reason=blank)` → `EMPTY_INPUT`
    - `AppError.ValidationError(field=content, reason=too_long)` → `INPUT_TOO_LONG`
    - `AppError.ImageTooLarge` → `IMAGE_TOO_LARGE`
    - `AppError.UnsupportedImageFormat` → `UNSUPPORTED_IMAGE_FORMAT`
    - `AppError.ValidationError(field=naturalLanguageRequest, reason=missing_time)` → `MISSING_TIME_INFO`
    - `AppError.ValidationError(그 외 reason)` → `INVALID_INPUT`
      (reason은 `core/common/ValidationReason.kt`의 표준 토큰(blank/too_long/missing_time)만 사용하며,
       매퍼는 부분 문자열 추측 없이 정확히 일치시킨다. 사용자 노출 문구는 `core/mapper/ErrorMessages.kt`가 담당)
    - `AppError.InFlightConflict` → `IN_FLIGHT_CONFLICT`
    - `AppError.DuplicateEvent` → `DUPLICATE_EVENT`
    - `AppError.PermissionDenied(permission=READ_CALENDAR|WRITE_CALENDAR)` → `PERMISSION_DENIED_CALENDAR`
    - `AppError.PermissionDenied(permission=RECORD_AUDIO)` → `PERMISSION_DENIED_MICROPHONE`
    - `AppError.PermissionDenied(permission=STORAGE|URI_ACCESS)` → `PERMISSION_DENIED_STORAGE`
    - `AppError.ModelNotFound` → `MODEL_NOT_FOUND`
    - `AppError.ModelNotReady` → `MODEL_NOT_READY`
    - `AppError.ModelInferenceTimeout` → `MODEL_INFERENCE_TIMEOUT`
    - `AppError.ModelInferenceError` → `MODEL_INFERENCE_ERROR`
    - `AppError.CalendarReadError` / `AppError.CalendarWriteError` → `CALENDAR_PROVIDER_ERROR`
    - `AppError.SttError` → `STT_ERROR`
    - `AppError.SearchError` → `SEARCH_TIMEOUT`
    - `AppError.NetworkUnavailable` → `NETWORK_UNAVAILABLE`
    - `AppError.DbWriteError` → `DB_WRITE_ERROR`
    - `AppError.DbMigrationError` → `DB_MIGRATION_ERROR`
    - `AppError.ExportFailed` → `EXPORT_FAILED`
    - `AppError.ImportManifestMismatch` → `IMPORT_MANIFEST_MISMATCH`
    - `AppError.ImportSchemaMismatch` → `IMPORT_SCHEMA_MISMATCH`
    - `AppError.InsufficientStorage` → `INSUFFICIENT_STORAGE`
    - `AppError.TemperatureWarning` → `TEMPERATURE_WARNING`
    - `AppError.TemperatureCritical` → `TEMPERATURE_CRITICAL`

  contact:
    name: Local Friday Dev
  license:
    name: Private

servers:
  - url: local://app
    description: |
      로컬 앱 내부 인터페이스.
      HTTP 서버가 아닌 로컬 함수 호출로 동작한다.

tags:
  - name: UseCase
    description: 비즈니스 로직 단위 — domain/usecase/
  - name: ModelRunner
    description: 모델 추론 인터페이스 — domain/modelrunner/
  - name: Tool
    description: Android 플랫폼 도구 인터페이스 — domain/tool/
  - name: Repository
    description: 메모리 저장소 인터페이스 — domain/memory/
  - name: ModelOutput
    description: AI 모델 구조화 출력 스키마
  - name: DomainModel
    description: 핵심 도메인 모델
  - name: Database
    description: Room DB 테이블 스키마
  - name: ExportImport
    description: Export/Import 파일 포맷 — v1

paths:

  /usecase/chat/send:
    post:
      tags: [UseCase]
      operationId: sendChatMessage
      summary: 텍스트 채팅 메시지 전송 # v0
      description: |
        사용자 텍스트(또는 음성 변환 텍스트)를 입력받아
        로컬 모델 응답을 생성하고 대화를 저장한다.

        **해당 파일**: `domain/usecase/SendChatMessageUseCase.kt`

        **흐름**:
        1. 입력 유효성 검사 (빈 입력 / 중복 전송 차단)
        2. ContextBuilder → Token-based Sliding Window를 적용하여 최근 대화와 지식을 3500 토큰 한도 내에서 조합
        3. PromptAssembler → 4블록 프롬프트 조립
        4. ModelRunner.generate() 호출
        5. ResponseParser → 응답 타입 판별
        6. 쓰기 작업이면 ApprovalCoordinator로 위임
        7. ConversationRepository 저장
        8. AuditTrailService 기록 (v0: 필수 이벤트, v1: 전체 이벤트)

        **정책**:
        - 빈 입력 전송 불가
        - in-flight 상태에서 중복 전송 차단
        - v0에서는 외부 API 호출 없음
        - v1 `searchEnabled=true`이면 검색 전 확인 문구와 쿼리 미리보기 후 질문 단위 검색 허용

        **구현 권고**:
        - v0에서 이미지 첨부 질의응답의 표준 진입점은 `/usecase/chat/image`이다
        - 본 요청의 `imageBase64`는 내부 통합 DTO 또는 향후 호환용 선택 필드로만 유지한다
      x-layer: domain/usecase
      x-file-path: domain/usecase/SendChatMessageUseCase.kt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
      responses:
        '200':
          description: 응답 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantResponseResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/InFlightConflict'
        '500':
          $ref: '#/components/responses/ModelError'

  /usecase/chat/voice:
    post:
      tags: [UseCase]
      operationId: processVoiceInput
      summary: 음성 입력 처리 # v0
      description: |
        STT 결과 텍스트를 채팅 흐름으로 전달한다.
        음성 녹음/인식은 SpeechToTextTool이 담당하며,
        이 UseCase는 변환된 텍스트를 SendChatMessageUseCase로 위임한다.

        **해당 파일**: `domain/usecase/ProcessVoiceInputUseCase.kt`

        **정책**:
        - STT 결과가 빈 문자열이면 처리하지 않는다
        - inputType은 항상 "voice"로 저장된다
        - transcript는 자동 전송하지 않고 사용자 확인 후 전송하는 UX를 권장한다
      x-layer: domain/usecase
      x-file-path: domain/usecase/ProcessVoiceInputUseCase.kt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceInputRequest'
      responses:
        '200':
          description: 음성 입력 처리 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantResponseResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ModelError'

  /usecase/chat/image:
    post:
      tags: [UseCase]
      operationId: processImageInput
      summary: 이미지 입력 처리 # v0
      description: |
        이미지 URI와 질문 텍스트를 입력받아
        멀티모달 모델 추론을 실행한다.

        **해당 파일**: `domain/usecase/ProcessImageInputUseCase.kt`

        **이미지 제한**:
        - 지원 형식: JPEG, PNG, WEBP
        - 최대 파일 크기: 10MB
        - 장축 최대 1024px (자동 리사이즈)

        **흐름**:
        1. ImageInputAdapter → 유효성 검사 + 리사이즈
        2. ModelRunner.generateWithImage() 호출
        3. 응답 저장 (inputType: "image")

        **정책**:
        - v0 이미지 질의응답의 기본 경로는 이 UseCase이다
        - 문서 요약은 문서 파일 직접 파싱이 아니라 문서 이미지 기반 요약을 의미한다
      x-layer: domain/usecase
      x-file-path: domain/usecase/ProcessImageInputUseCase.kt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageInputRequest'
      responses:
        '200':
          description: 이미지 처리 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantResponseResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/ImageTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/ModelError'

  /usecase/calendar/today:
    get:
      tags: [UseCase]
      operationId: getTodaySchedule
      summary: 오늘/주간 일정 조회 # v0
      description: |
        Android Calendar Provider에서 일정을 읽어
        선택적으로 AI 요약을 포함하여 반환한다.

        **해당 파일**: `domain/usecase/GetTodayScheduleUseCase.kt`

        **정책**:
        - 캘린더 읽기는 자동 허용 (승인 불필요)
        - 권한 없을 경우 PermissionDenied 오류 반환
        - AI 요약은 구조화 JSON이 아닌 plain text 응답을 기대한다
      x-layer: domain/usecase
      x-file-path: domain/usecase/GetTodayScheduleUseCase.kt
      parameters:
        - name: rangeType
          in: query
          required: false
          schema:
            type: string
            enum: [today, week]
            default: today
          description: 조회 범위
        - name: includeSummary
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: AI 요약 포함 여부
      responses:
        '200':
          description: 일정 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResult'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '500':
          $ref: '#/components/responses/CalendarProviderError'

  /usecase/calendar/draft:
    post:
      tags: [UseCase]
      operationId: createCalendarDraft
      summary: 자연어 → 캘린더 초안 생성 # v0
      description: |
        자연어 일정 요청을 파싱하여 CalendarDraft를 생성한다.
        이 단계에서는 캘린더에 저장하지 않는다.
        저장은 반드시 사용자 승인 후 ApproveAndSaveEvent를 통해 실행된다.

        **해당 파일**: `domain/usecase/CreateCalendarDraftUseCase.kt`

        **모델 출력 타입**: `CalendarDraftOutput` (action: "calendar_draft")

        **정책**:
        - confidence < 0.7이면 불확실 플래그 설정
        - 시간 정보 누락 시 내부 계약 상 ValidationError를 반환할 수 있다
        - 다만 대화 UX에서는 단순 오류 대신 재확인 질문으로 변환하는 것이 기본 정책이다
        - 이 UseCase는 쓰기 작업을 하지 않는다
      x-layer: domain/usecase
      x-file-path: domain/usecase/CreateCalendarDraftUseCase.kt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftRequest'
      responses:
        '200':
          description: 초안 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarDraftResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ModelError'

  /usecase/calendar/approve:
    post:
      tags: [UseCase]
      operationId: approveAndSaveEvent
      summary: 승인 후 캘린더 저장 # v0
      description: |
        사용자가 CalendarDraft를 승인하면 캘린더에 저장하고
        Audit 이벤트를 기록한다.
        거부 시에는 저장 없이 거부 이력만 기록한다.

        **해당 파일**: `domain/usecase/ApproveAndSaveEventUseCase.kt`

        **정책**:
        - 승인 여부와 관계없이 Audit에 반드시 기록
        - 캘린더 쓰기 실패 시 Audit에 오류 기록 후 오류 반환
        - 승인/거부 Audit 기록의 단일 책임 주체는 이 UseCase이다
        - 이 UseCase만이 캘린더 쓰기를 수행한다
      x-layer: domain/usecase
      x-file-path: domain/usecase/ApproveAndSaveEventUseCase.kt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalActionRequest'
      responses:
        '200':
          description: 승인/거부 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResult'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '500':
          $ref: '#/components/responses/CalendarProviderError'

  /usecase/memory/export:
    post:
      tags: [UseCase]
      operationId: exportMemory
      summary: 메모리 Export # v1
      description: |
        5계층 메모리와 설정을 JSON + SQLite 묶음 ZIP 파일로 저장한다.

        **해당 파일**: `domain/usecase/ExportMemoryUseCase.kt`

        **Export 파일 구조**:
        ```
        local_friday_export_{timestamp}.zip
        ├── export_manifest.json
        ├── friday_db.sqlite
        └── settings.json
        ```

        **정책**:
        - export 완료 후 Audit에 EXPORT 이벤트 기록
        - export 파일에 개인정보 포함 사실을 응답에 명시
        - v1에서 암호화 없음
      x-layer: domain/usecase
      x-file-path: domain/usecase/ExportMemoryUseCase.kt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: Export 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResult'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '507':
          $ref: '#/components/responses/InsufficientStorage'
        '500':
          $ref: '#/components/responses/ExportError'

  /usecase/memory/import:
    post:
      tags: [UseCase]
      operationId: importMemory
      summary: 메모리 Import # v1
      description: |
        Export 파일을 가져와 manifest 검증 후 복원한다.

        **해당 파일**: `domain/usecase/ImportMemoryUseCase.kt`

        **검증 순서**:
        1. ZIP 파일 구조 확인
        2. export_manifest.json 파싱
        3. 앱 버전 / DB 스키마 버전 호환성 확인
        4. DB 복원
        5. 설정 복원
        6. Audit에 IMPORT 이벤트 기록

        **정책**:
        - 스키마 버전 불일치 시 import 중단 + 오류 반환
        - 현재 데이터 덮어쓰기 전 사용자 확인 필요 (UI 레벨에서 처리)
      x-layer: domain/usecase
      x-file-path: domain/usecase/ImportMemoryUseCase.kt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: Import 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/ManifestMismatch'
        '409':
          $ref: '#/components/responses/SchemaMismatch'
        '500':
          $ref: '#/components/responses/ImportError'

  /usecase/memory/knowledge/search:
    post:
      tags: [UseCase]
      operationId: searchKnowledge
      summary: 로컬 지식 메모 검색 # v1
      description: |
        KnowledgeRepository에서 최신순 / 태그 기반으로 메모를 검색한다.
        ContextBuilder가 프롬프트 조합 시 이 UseCase를 호출한다.

        **해당 파일**: `domain/usecase/SearchKnowledgeUseCase.kt`

        **v1 검색 방식**: 최신순 정렬 + 태그 필터링
        **v2 이후**: 벡터 유사도 검색 추가 예정
      x-layer: domain/usecase
      x-file-path: domain/usecase/SearchKnowledgeUseCase.kt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeSearchRequest'
      responses:
        '200':
          description: 검색 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSearchResult'
        '500':
          $ref: '#/components/responses/DatabaseError'

  /modelrunner/generate:
    post:
      tags: [ModelRunner]
      operationId: modelGenerate
      summary: 텍스트 추론 # v0
      description: |
        조립된 프롬프트를 LiteRT-LM에 전달하여 텍스트를 생성한다.

        **해당 파일**: `domain/modelrunner/ModelRunner.kt`
        **구현 파일**: `runtime/gemma/GemmaModelRunner.kt`

        **모델 설정**:
        - SDK: LiteRT-LM
        - 모델: Gemma 4 E4B-it (INT4 양자화)
        - 포맷: .litertlm
        - 최대 컨텍스트: 4096 tokens (v0)

        **스트리밍**:
        - v0 기본: 비스트리밍 (onToken 콜백 null)
        - v1 선택적 스트리밍: onToken 콜백 제공 시 토큰 단위 반환

        **응답 유형 주의**:
        - 채팅/에이전트 흐름에서는 구조화 JSON 응답을 기대할 수 있다
        - 단순 요약 UseCase에서는 plain text 응답을 기대할 수 있다
      x-layer: domain/modelrunner
      x-file-path: domain/modelrunner/ModelRunner.kt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: 텍스트 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResult'
        '408':
          $ref: '#/components/responses/ModelTimeout'
        '503':
          $ref: '#/components/responses/ModelNotReady'
        '500':
          $ref: '#/components/responses/ModelError'

  /modelrunner/generate-with-image:
    post:
      tags: [ModelRunner]
      operationId: modelGenerateWithImage
      summary: 이미지 + 텍스트 멀티모달 추론 # v0
      description: |
        이미지 바이트 배열과 텍스트 프롬프트로 멀티모달 추론을 실행한다.

        **해당 파일**: `domain/modelrunner/ModelRunner.kt`
        **구현 파일**: `runtime/gemma/GemmaModelRunner.kt`

        **이미지 전처리**: ImageInputAdapter가 1024px 리사이즈 후 전달
      x-layer: domain/modelrunner
      x-file-path: domain/modelrunner/ModelRunner.kt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateWithImageRequest'
      responses:
        '200':
          description: 멀티모달 추론 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResult'
        '408':
          $ref: '#/components/responses/ModelTimeout'
        '503':
          $ref: '#/components/responses/ModelNotReady'
        '500':
          $ref: '#/components/responses/ModelError'

  /modelrunner/load-state:
    get:
      tags: [ModelRunner]
      operationId: getModelLoadState
      summary: 모델 로드 상태 조회 # v0
      description: |
        현재 모델 로드 상태를 반환한다.
        앱 시작 시 UI가 이 상태를 구독하여 로딩 화면을 표시한다.

        **해당 파일**: `domain/modelrunner/ModelLoadState.kt`
      x-layer: domain/modelrunner
      x-file-path: domain/modelrunner/ModelLoadState.kt
      responses:
        '200':
          description: 상태 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelLoadStateResult'

  /tool/calendar/events:
    post:
      tags: [Tool]
      operationId: calendarReadEvents
      summary: 캘린더 일정 읽기 # v0
      description: |
        Android Calendar Provider에서 지정 기간의 일정을 읽는다.

        **해당 파일**: `domain/tool/CalendarTool.kt`
        **구현 파일**: `platform/calendar/AndroidCalendarTool.kt`

        **정책**:
        - 읽기는 자동 허용 (승인 불필요)
        - 권한: READ_CALENDAR
      x-layer: domain/tool
      x-file-path: domain/tool/CalendarTool.kt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarReadRequest'
      responses:
        '200':
          description: 일정 목록 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventsResult'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '500':
          $ref: '#/components/responses/CalendarProviderError'

  /tool/calendar/insert:
    post:
      tags: [Tool]
      operationId: calendarInsert
      summary: 캘린더 일정 저장 # v0
      description: |
        ApproveAndSaveEventUseCase에서만 호출된다.
        직접 호출 금지.

        **해당 파일**: `domain/tool/CalendarTool.kt`
        **구현 파일**: `platform/calendar/AndroidCalendarTool.kt`

        **정책**:
        - 반드시 ApproveAndSaveEventUseCase를 통해서만 호출
        - 직접 호출 시 PreExecutionGuard가 차단
        - 권한: WRITE_CALENDAR

        **중복 정책**:
        - 동일 시간대 또는 유사 일정 감지는 경고 목적이다
        - 실제 저장 차단 여부는 구현 정책에 따르며, v0 기본 UX 정책은 사용자 확인 우선이다
      x-layer: domain/tool
      x-file-path: domain/tool/CalendarTool.kt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarInsertRequest'
      responses:
        '200':
          description: 저장 성공 — 생성된 이벤트 ID 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarInsertResult'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/DuplicateEvent'
        '500':
          $ref: '#/components/responses/CalendarProviderError'

  /tool/stt/start:
    post:
      tags: [Tool]
      operationId: sttStart
      summary: STT 녹음 시작 # v0
      description: |
        Android SpeechRecognizer를 시작한다.
        오프라인 STT를 우선 사용한다.

        **해당 파일**: `domain/tool/SpeechToTextTool.kt`
        **구현 파일**: `platform/speech/AndroidSpeechToTextTool.kt`

        **정책**:
        - EXTRA_PREFER_OFFLINE = true 반드시 설정
        - 권한: RECORD_AUDIO
      x-layer: domain/tool
      x-file-path: domain/tool/SpeechToTextTool.kt
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SttStartRequest'
      responses:
        '200':
          description: STT 시작 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SttStartResult'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '500':
          $ref: '#/components/responses/SttError'

  /tool/stt/result:
    get:
      tags: [Tool]
      operationId: sttGetResult
      summary: STT 상태 및 인식 결과 반환 # v0
      description: |
        STT 상태와 transcript를 반환한다.
        인식 중이면 `state=LISTENING` 또는 `TRANSCRIBING`,
        최종 텍스트가 준비되면 `state=DONE`, `transcribedText`가 채워진다.

        **계약 원칙**:
        - 구현은 callback보다 `state + transcript` 상태 관찰 계약을 기본으로 한다
        - transcript는 최종 인식 결과를 의미하며 자동 전송을 강제하지 않는다
      x-layer: domain/tool
      x-file-path: domain/tool/SpeechToTextTool.kt
      responses:
        '200':
          description: 결과 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SttResult'
        '500':
          $ref: '#/components/responses/SttError'

  /tool/search:
    post:
      tags: [Tool]
      operationId: webSearch
      summary: 웹 검색 (질문 단위) # v1
      description: |
        질문 단위로 허용된 경우에만 호출된다.
        PreExecutionGuard가 검색 허용 여부를 확인한다.

        **해당 파일**: `domain/tool/WebSearchTool.kt`
        **구현 파일**: `platform/network/WebSearchGateway.kt`

        **v0 구현**: 없음. 호출하지 않는다.
        **v1 이후**: 검색 전 사용자 확인 + 쿼리 미리보기 후 실제 검색 엔진 연결

        **정책**:
        - `searchEnabled = true` 인 경우에만 호출
        - 검색 전 사용자에게 확인 문구와 검색 쿼리 미리보기를 표시해야 한다
        - 사용자가 토글 ON을 확정하면 해당 질문의 검색 승인으로 간주한다
        - 사용자 대화 전문, 일정 전문, 메모 전문을 그대로 검색 요청으로 보내지 않는다
        - 민감 정보 포함 가능 쿼리는 사용자 확인 없이 호출할 수 없다
        - 호출 후 반드시 Audit에 SEARCH_USED 기록
        - 실패 시 로컬 응답으로 fallback (오류 전파 않음)
      x-layer: domain/tool
      x-file-path: domain/tool/WebSearchTool.kt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSearchRequest'
      responses:
        '200':
          description: 검색 결과 반환 (결과 없으면 빈 배열)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSearchResult'
        '408':
          $ref: '#/components/responses/SearchTimeout'
        '503':
          $ref: '#/components/responses/NetworkUnavailable'

components:
  schemas:

    SendChatMessageRequest:
      type: object
      required: [content, inputType, sessionId]
      x-kotlin-type: SendChatMessageRequest
      x-file-path: domain/usecase/SendChatMessageUseCase.kt
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 8192
          description: 사용자 입력 텍스트 (v0 문자 길이 제한)
        inputType:
          $ref: '#/components/schemas/InputType'
        imageBase64:
          type: string
          nullable: true
          description: |
            내부 통합 DTO 호환을 위한 선택 필드.
            v0 기본 이미지 입력 경로는 `/usecase/chat/image`이며,
            일반적인 구현에서는 이 필드를 사용하지 않는다.
            사용 시에도 전처리 완료된 이미지여야 한다.
        searchEnabled:
          type: boolean
          default: false
          description: |
            v1: 질문 단위 검색 허용 여부.
            v0에서는 항상 false로 취급한다.
        sessionId:
          type: string
          format: uuid
          description: 현재 대화 세션 ID

    VoiceInputRequest:
      type: object
      required: [transcribedText, sessionId]
      x-kotlin-type: VoiceInputRequest
      x-file-path: domain/usecase/ProcessVoiceInputUseCase.kt
      properties:
        transcribedText:
          type: string
          minLength: 1
          description: STT 변환 결과 텍스트
        searchEnabled:
          type: boolean
          default: false
          description: v1: 음성 입력에서도 질문 단위 검색 가능. v0에서는 항상 false로 취급.
        sessionId:
          type: string
          format: uuid

    ImageInputRequest:
      type: object
      required: [imageUri, prompt, sessionId]
      x-kotlin-type: ImageInputRequest
      x-file-path: domain/usecase/ProcessImageInputUseCase.kt
      properties:
        imageUri:
          type: string
          description: Android content:// 또는 file:// URI
        prompt:
          type: string
          minLength: 1
          description: 이미지에 대한 질문
        sessionId:
          type: string
          format: uuid

    CreateDraftRequest:
      type: object
      required: [naturalLanguageRequest, sessionId]
      x-kotlin-type: CreateDraftRequest
      x-file-path: domain/usecase/CreateCalendarDraftUseCase.kt
      properties:
        naturalLanguageRequest:
          type: string
          minLength: 1
          description: 자연어 일정 요청
        sessionId:
          type: string
          format: uuid

    ApprovalActionRequest:
      type: object
      required: [draft, approved, sessionId]
      x-kotlin-type: ApprovalActionRequest
      x-file-path: domain/usecase/ApproveAndSaveEventUseCase.kt
      properties:
        draft:
          $ref: '#/components/schemas/CalendarDraft'
        approved:
          type: boolean
          description: true = 승인, false = 거부
        sessionId:
          type: string
          format: uuid

    ExportRequest:
      type: object
      required: [targetDirUri]
      x-kotlin-type: ExportRequest
      x-file-path: domain/usecase/ExportMemoryUseCase.kt
      description: v1 전용. v0에서는 구현하지 않는다.
      properties:
        targetDirUri:
          type: string
          description: 저장할 디렉토리 URI (content:// 또는 file://)
        includes:
          type: array
          items:
            type: string
            enum: [profiles, conversations, tasks, knowledge_notes, audit_events, settings]
          default: [profiles, conversations, tasks, knowledge_notes, audit_events, settings]
          description: 포함할 데이터 범위 (기본: 전체)

    ImportRequest:
      type: object
      required: [importFileUri]
      x-kotlin-type: ImportRequest
      x-file-path: domain/usecase/ImportMemoryUseCase.kt
      description: v1 전용. v0에서는 구현하지 않는다.
      properties:
        importFileUri:
          type: string
          description: 가져올 export ZIP 파일 URI
        overwriteExisting:
          type: boolean
          default: false
          description: 기존 데이터 덮어쓰기 여부 (UI에서 사용자 확인 후 true로 설정)

    KnowledgeSearchRequest:
      type: object
      x-kotlin-type: KnowledgeSearchRequest
      x-file-path: domain/usecase/SearchKnowledgeUseCase.kt
      description: v1 전용. v0 ContextBuilder는 Conversation 최근 5턴만 사용한다.
      properties:
        query:
          type: string
          nullable: true
          description: 검색 키워드 (null이면 최신순 반환)
        tags:
          type: array
          items:
            type: string
          description: 태그 필터 (AND 조건)
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
          description: 반환할 최대 항목 수

    GenerateRequest:
      type: object
      required: [prompt]
      x-kotlin-type: GenerateRequest
      x-file-path: domain/modelrunner/ModelRunner.kt
      properties:
        prompt:
          type: string
          description: PromptAssembler가 조립한 전체 프롬프트
        streamingEnabled:
          type: boolean
          default: false
          description: v0 기본 false. v1에서 true이면 토큰 단위 스트리밍

    GenerateWithImageRequest:
      type: object
      required: [prompt, imageBytes]
      x-kotlin-type: GenerateWithImageRequest
      x-file-path: domain/modelrunner/ModelRunner.kt
      properties:
        prompt:
          type: string
          description: 이미지에 대한 질문 프롬프트
        imageBytes:
          type: string
          format: byte
          description: 전처리된 이미지 바이트(Base64)

    CalendarReadRequest:
      type: object
      required: [startMs, endMs]
      x-kotlin-type: CalendarReadRequest
      x-file-path: domain/tool/CalendarTool.kt
      properties:
        startMs:
          type: integer
          format: int64
        endMs:
          type: integer
          format: int64

    CalendarInsertRequest:
      type: object
      required: [draft]
