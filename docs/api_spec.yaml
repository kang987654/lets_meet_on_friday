  responses:

    ValidationError:
      description: 입력 유효성 오류
      content:
        application/json:
          schema:
            type: object
            required: [success, error]
            properties:
              success:
                type: boolean
                example: false
              error:
                $ref: '#/components/schemas/ApiError'
          examples:
            emptyInput:
              value:
                success: false
                error:
                  code: "EMPTY_INPUT"
                  message: "메시지를 입력해주세요."
                  field: "content"
            inputTooLong:
              value:
                success: false
                error:
                  code: "INPUT_TOO_LONG"
                  message: "메시지가 너무 깁니다."
                  field: "content"
            missingTimeInfo:
              value:
                success: false
                error:
                  code: "MISSING_TIME_INFO"
                  message: "일정 시간 정보가 없습니다. 날짜와 시간을 알려주세요."
                  field: "naturalLanguageRequest"

