# [WHY] Robolectric 4.14 의 에뮬레이션 상한은 SDK 35 인데 앱의 targetSdk 는 37 이다 —
# 고정하지 않으면 모든 Robolectric 테스트가 "targetSdkVersion=37 > maxSdkVersion=35" 로
# 구성 단계에서 죽는다(2026-08-14, targetSdk 상향 회차). 35 는 지금까지 테스트가 돌던
# 조건 그대로이므로 테스트의 의미는 바뀌지 않고, 실기기의 37 동작 확인은 기기 검증이 맡는다.
# Robolectric 을 37 지원 버전으로 올리는 날 이 고정을 함께 재검토할 것.
sdk=35
