[versions]
agp = "9.3.1"
kotlin = "2.4.10"
# [WHY] KSP 는 독립 버저닝 — 2.3.10 부터 Kotlin 2.4 의 기본 모듈명 형식을 지원한다(릴리스 노트).
ksp = "2.3.11"
# [WHY] kotlin 2.4 와 한 몸 — 2.59 는 kotlin 2.4 메타데이터를 못 읽어 KSP 가 죽는다
# ("maximum supported version is 2.3.0", 2026-08-14 실측). kotlin 을 되돌리면 hilt 도 함께 볼 것.
hilt = "2.60.1"

compose-bom = "2026.08.00"
navigation = "2.9.8"
room = "2.8.4"
datastore = "1.2.1"
paging = "3.5.1"
coroutines = "1.11.0"
# [WHY] 0.14.0 → 0.16.0. 글자 유실("2026-08-17T10:00" → "…T01:000")의 남은 유일한 후보가
# 이 런타임이었다 — 파이썬 패키지 0.15.0·0.16.0 양쪽에서 자릿수가 36/36 온전했으므로(exp22)
# 앱과 하네스의 차이가 버전뿐이었다. ADR-016 은 "버전이 달라 가를 수 없다" 고 적었으나
# Google Maven 에 0.15.0·0.16.0 AAR 이 모두 있었다(확인하지 않은 추정이었다).
#
# [WHY] 상향 위험을 미리 쟀다 — classes.jar 비교로 0.14.0 → 0.16.0 은 클래스 8개 추가·
# **제거 0개**이고 우리가 쓰는 심볼(ExperimentalFlags·renderPrefaceIntoString·Capabilities·
# EngineConfig 필드·SamplerConfig·ToolSet)이 전부 남아 있다. 추가분에 `ThinkingConfig` 가 있어
# 맵 키로 끄던 생각 모드를 타입 API 로 옮길 수 있게 됐다.
litertlm = "0.16.0"
# [WHY] 5.x 는 메이저 상향(API 변경 가능) — 4.12 에 문제가 없고, 메이저는 필요가 생길 때
# 별도 회차로 한다 (0.16.0 최신화 회차 판정, mockwebserver 도 같은 키를 쓴다).
okhttp = "4.12.0"
# [WHY] GPU 델리게이트 = 모델 런타임 인접 — litertlm 과 같은 이유로 승격 시 실기기 재검증이
# 필요하므로 일반 최신화 회차(0.16.0)에서 제외했다.
playServicesTfliteJava = "16.4.0"
playServicesTfliteGpu = "16.4.0"
commonmark = "1.0.0-alpha05"
richtext = "1.0.0-alpha05"
lifecycleProcess = "2.11.0"

kotlinx-serialization-json = "1.11.0"
kotlinx-collections-immutable = "0.5.1"
# [WHY] hilt-navigation-compose 와 hilt-work 는 같은 androidx.hilt 릴리스 트레인이므로 버전 키를 공유한다.
androidx-hilt = "1.4.0"
work = "2.11.2"
core-ktx = "1.19.0"
# [WHY] 아래 테스트 스코프 전용은 런타임에 실리지 않으므로, 실기기 검증(0.15.1)을
# 무효화하지 않고 올릴 수 있는 유일한 범주다. 게이트는 전체 단위 테스트 + lint 통과.
espressoCore = "3.7.0"
androidxTestExtJunit = "1.3.0"
# [WHY] robolectric 4.16.1 은 VoiceChatIntegrationTest 를 **단독 실행에서도 2/2 결정적으로**
# 깨뜨린다(2026-08-14 실측; 전체 실행에서는 간헐 통과 — ShadowLooper 타이밍 의존 테스트라
# 스케줄러 변화에 민감). 4.14 로 되돌리면 소멸. 상향은 테스트의 대기 구조를 손보는 회차에서
# 재시도할 것 — 테스트 단언을 완화해서 맞추는 것은 금지 규칙이다.
robolectric = "4.14"
junit = "4.13.2"
mockk = "1.14.11"
# [WHY] 1.0.0 은 메이저 상향인 데다, 이 라이브러리는 영어 전용 임베더 하나만 쓰는 죽은 경로에
# 가깝다(APK 52MB, ADR-013·0.14.0 관측) — 올리는 것보다 걷어내는 판단이 먼저다.
mediapipe = "0.10.35"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

[libraries]
# Kotlinx Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }

# Coroutines & Collections
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }
javax-inject = { module = "javax.inject:javax.inject", version = "1" }
androidx-paging-common = { module = "androidx.paging:paging-common", version.ref = "paging" }

# Compose BOM + 주요 Compose 라이브러리
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }

# Activity / Lifecycle / Navigation
androidx-activity-compose = { module = "androidx.activity:activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
# [WHY] hiltViewModel 이 androidx.hilt.navigation.compose 에서 이 아티팩트로 옮겨졌다.
# hilt-navigation-compose 는 이제 deprecated 위임만 남아 사용처가 0이므로 제거했다 —
# 새 아티팩트는 그 전이 의존으로만 들어오던 상태라, core-ktx 와 같은 이유로 명시한다.
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidx-hilt" }
# [WHY] androidx.hilt:hilt-compiler 는 dagger hilt-compiler 를 대체하지 않는다 —
# @HiltWorker 팩토리 생성물이 달라 둘 다 KSP 에 등록해야 한다.
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidx-hilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidx-hilt" }

# [WHY] 지금까지 transitive 로만 들어오던 core-ktx 를 명시한다 — NotificationCompat 를
# 직접 쓰기 시작하면서 우연한 전이 의존에 기대면 안 되는 상태가 되었다.
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }

# WorkManager
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }

# Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# DataStore
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Paging
androidx-paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "paging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }

# LiteRT-LM & MediaPipe
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }
# [WHY] litertlm 의 ReflectionTool 이 KFunction 으로 툴 스키마를 만들므로 kotlin-reflect 가 필요하다.
# 없으면 컴파일은 되고 툴 선언 시점에 런타임 실패한다 (google-ai-edge/gallery 도 동일하게 선언).
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
mediapipe-tasks-text = { module = "com.google.mediapipe:tasks-text", version.ref = "mediapipe" }

# OkHttp
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

# TFLite GPU Delegate
play-services-tflite-java = { module = "com.google.android.gms:play-services-tflite-java", version.ref = "playServicesTfliteJava" }
play-services-tflite-gpu = { module = "com.google.android.gms:play-services-tflite-gpu", version.ref = "playServicesTfliteGpu" }
play-services-tflite-support = { module = "com.google.android.gms:play-services-tflite-support", version.ref = "playServicesTfliteJava" }

# Compose RichText (Markdown)
compose-richtext-commonmark = { module = "com.halilibo.compose-richtext:richtext-commonmark", version.ref = "commonmark" }
compose-richtext-ui-material3 = { module = "com.halilibo.compose-richtext:richtext-ui-material3", version.ref = "richtext" }

# Lifecycle Process
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycleProcess" }

# 테스트 / 디버그 보조
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
